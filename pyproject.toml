[project]
name = "rag-chatflow"
version = "0.1.0"
description = "LangGraph recreation of the Wulingyuan Dify RAG and vision chatflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116",
  "langgraph>=0.6",
  "openai>=1.90",
  "pydantic-settings>=2.9",
  "python-multipart>=0.0.20",
  "qdrant-client>=1.14",
  "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.26",
  "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_chatflow"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
